name: Minify CSS

on:
  push:
    branches: [main]
    # Sadece KAYNAK css dosyaları değişince çalışır.
    # Bot'un commit'lediği *.min.css ve .html dosyaları bu filtreye uymadığı için
    # workflow kendi kendini tetiklemez (döngü olmaz).
    paths:
      - 'css/*.css'
      - '!css/*.min.css'
      - 'js/main.js'
      - '.github/workflows/minify.yml'
  workflow_dispatch:

# Aynı anda iki çalışma birbirinin push'unu ezmesin; sıraya girsin.
concurrency:
  group: minify-css
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: esbuild kur (sabit sürüm)
        run: npm install -g esbuild@0.25.0

      - name: CSS dosyalarını küçült
        run: |
          set -euo pipefail
          shopt -s nullglob

          # grep eşleşme bulamazsa 1 döner; pipefail altında betiği öldürmesin
          count() { grep -o -- "$1" "$2" | wc -l || true; }

          for src in css/*.css; do
            case "$src" in *.min.css) continue ;; esac
            out="${src%.css}.min.css"

            esbuild "$src" --minify --outfile="$out" --log-level=warning

            # Güvenlik kontrolleri
            [ -s "$out" ] || { echo "::error::$out boş üretildi"; exit 1; }

            src_wk=$(count '-webkit-' "$src")
            out_wk=$(count '-webkit-' "$out")
            if [ "$out_wk" -lt "$src_wk" ]; then
              echo "::error::$out içinde -webkit- sayısı düştü ($src_wk -> $out_wk)"
              exit 1
            fi

            echo "$src -> $out"
            echo "  boyut      : $(wc -c < "$src") -> $(wc -c < "$out") bayt"
            echo "  -webkit-   : $src_wk -> $out_wk"
            echo "  @media     : $(count '@media' "$src") -> $(count '@media' "$out")"
            echo "  @keyframes : $(count '@keyframes' "$src") -> $(count '@keyframes' "$out")"
          done

      - name: HTML'lerde ?v= parametresini hash ile güncelle
        run: |
          set -euo pipefail
          # update <dosya> <HTML'de aranacak desen (sed -E, "?v=" dahil)>
          update() {
            local file="$1" pattern="$2"
            [ -f "$file" ] || { echo "$file yok, atlanıyor"; return 0; }
            local hash
            hash=$(sha256sum "$file" | cut -c1-10)
            echo "$file -> v=$hash"
            find . -name '*.html' -not -path './.git/*' -not -path './node_modules/*' -print0 \
              | xargs -0 sed -i -E "s#(${pattern})[A-Za-z0-9._-]+#\1${hash}#g"
          }
          update css/style.min.css  '/css/style\.min\.css\?v='
          update css/footer.min.css '/css/footer\.min\.css\?v='
          # Hem "/js/main.js?v=" hem "js/main.js?v=" (başında / olmayan) yazımını yakalar
          update js/main.js         'js/main\.js\?v='

      - name: Değişiklik varsa commit'le ve push'la
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- 'css/*.min.css' '*.html'

          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi

          git commit -m "chore: CSS küçültüldü, sürüm parametresi güncellendi"
          git pull --rebase origin main
          git push origin HEAD:main
